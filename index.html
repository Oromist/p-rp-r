<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pırpır Sakinleşiyor — Oyun</title>
<style>
/* ============================================================
   PIRPIR SAKİNLEŞİYOR — RB Studio
   Amaç: Pırpır öfkelenmeden arkadaşlarına ulaşsın!
   Kızarırsa → Nefes Alanı → bir güzel nefes → devam
   Kitap: Çağrı Odabaşı, Uçan Fil Yayınları
   ============================================================ */
:root{
  --su-acik:#3DBDAB; --su:#2BA89A; --su-koyu:#1B7F75; --su-dip:#14655E;
  --mercan:#E8744F; --mercan-koyu:#C9512F;
  --krem:#FFF6E8; --murekkep:#2E3138;
  --altin:#FFD66B; --kivilcim:#FF5436;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:ui-rounded,"Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  background:var(--su);color:var(--murekkep);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  touch-action:none;position:fixed;inset:0;
}
button{font-family:inherit;border:none;cursor:pointer;background:none;}

/* ---------- ARKA PLAN (kitabın suluboya dünyası) ---------- */
#dunya{position:absolute;inset:0;overflow:hidden;}
#dunya .resim{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center bottom;}
.isik{position:absolute;top:-12%;width:16vmax;height:75%;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0));
  transform:skewX(-14deg);animation:isikSalin 9s ease-in-out infinite alternate;pointer-events:none;}
@keyframes isikSalin{from{opacity:.45}to{opacity:.9;transform:skewX(-10deg) translateX(3vmax)}}
.ob{position:absolute;bottom:-8vmin;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.75),rgba(255,255,255,.1) 58%,rgba(255,255,255,.04));
  animation:yuksel linear infinite;}
@keyframes yuksel{0%{transform:translateY(0)}8%{opacity:.65}92%{opacity:.55}100%{transform:translateY(-112vh) translateX(4vmin);opacity:0}}

/* ---------- SAHNE ---------- */
#sahne{position:absolute;inset:0;z-index:5;overflow:hidden;}
#ustBar{position:absolute;top:max(1.6vmin,env(safe-area-inset-top));left:0;right:0;
  display:flex;align-items:center;gap:2vmin;padding:0 2.6vmin;z-index:40;pointer-events:none;}
.skorKutu{display:flex;align-items:center;gap:1vmin;background:rgba(0,0,0,.28);
  border-radius:99px;padding:1vmin 2.4vmin;color:var(--krem);flex:none;
  font-weight:bold;font-size:clamp(17px,4.6vmin,30px);}
#sesDugme{pointer-events:auto;width:clamp(44px,9vmin,60px);height:clamp(44px,9vmin,60px);
  flex:none;border-radius:50%;background:rgba(0,0,0,.28);font-size:clamp(18px,4.2vmin,26px);
  display:flex;align-items:center;justify-content:center;}

/* yolculuk çubuğu: Pırpır → arkadaşlar */
#yolKap{flex:1;height:clamp(20px,4.4vmin,32px);background:rgba(0,0,0,.28);
  border-radius:99px;position:relative;}
#yolDolgu{position:absolute;inset:0;border-radius:99px;
  background:linear-gradient(90deg,#7ED8C9,var(--altin));
  clip-path:inset(0 100% 0 0 round 99px);transition:clip-path .3s;}
#yolPirpir{position:absolute;left:0;top:50%;width:clamp(30px,6.6vmin,46px);
  transform:translate(-30%,-50%);transition:left .3s;
  filter:drop-shadow(0 .3vmin .4vmin rgba(0,0,0,.3));}
#yolHedef{position:absolute;right:.4vmin;top:50%;transform:translateY(-50%);
  font-size:clamp(14px,3.4vmin,22px);}

#ustBar2{position:absolute;top:calc(max(1.6vmin,env(safe-area-inset-top)) + clamp(34px,7vmin,50px));
  left:0;right:0;display:flex;align-items:center;gap:2vmin;padding:0 2.6vmin;z-index:40;pointer-events:none;}
#canlar{display:flex;gap:.6vmin;background:rgba(0,0,0,.28);border-radius:99px;
  padding:.8vmin 1.8vmin;font-size:clamp(15px,4vmin,26px);flex:none;}
#canlar .kalp{transition:transform .2s;}
#canlar .kalp.gitti{filter:grayscale(1);opacity:.4;transform:scale(.8);}
#ofkeKap{flex:1;height:clamp(18px,4vmin,28px);background:rgba(0,0,0,.28);
  border-radius:99px;position:relative;overflow:hidden;}
#ofkeDolgu{position:absolute;inset:0;border-radius:99px;
  background:linear-gradient(90deg,#FF8A70,#FF5436 50%,#E03A2F 80%,#B71C1C);
  clip-path:inset(0 100% 0 0 round 99px);transition:clip-path .25s;}
#ofkeKap .uc{position:absolute;right:.8vmin;top:50%;transform:translateY(-50%);
  font-size:clamp(11px,2.8vmin,18px);}
#komboYazi{position:absolute;top:21vmin;left:50%;transform:translateX(-50%) scale(0);
  font-size:clamp(24px,7vmin,52px);font-weight:bold;color:var(--altin);
  text-shadow:0 .5vmin 0 rgba(0,0,0,.25);z-index:40;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);pointer-events:none;}
#komboYazi.gor{transform:translateX(-50%) scale(1);}

/* Pırpır */
#pirpir{position:absolute;left:10%;top:45%;width:clamp(96px,24vmin,200px);height:clamp(96px,24vmin,200px);
  z-index:20;will-change:transform;pointer-events:none;transition:left 1.8s ease-in-out;}
#aura{position:absolute;inset:-18%;border-radius:50%;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle,rgba(255,80,30,.78) 0%,rgba(255,120,40,.35) 48%,rgba(255,120,40,0) 72%);
  filter:blur(.5vmin);}
#pirpirIc{width:100%;height:100%;position:relative;}
.pSprite{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .18s;
  filter:drop-shadow(0 1vmin 1.2vmin rgba(0,0,0,.22));}
.pSprite.gor{opacity:1;}
#pirpir.carp #pirpirIc{animation:carpildi .5s;}
@keyframes carpildi{0%,100%{transform:scale(1)}30%{transform:scale(.82) rotate(-8deg)}60%{transform:scale(1.08) rotate(4deg)}}
#pirpir.yanip .pSprite.gor{animation:yanSon .25s steps(2) 4;}
@keyframes yanSon{50%{opacity:.25}}
#pirpir.mutlu #pirpirIc{animation:mutluZipla .6s cubic-bezier(.34,1.56,.64,1);}
@keyframes mutluZipla{0%,100%{transform:scale(1) rotate(0)}40%{transform:scale(1.18) rotate(-7deg)}70%{transform:scale(.95) rotate(4deg)}}

/* arkadaşlar (finalde sağdan gelir) */
#arkadaslar{position:absolute;right:-46%;top:50%;width:clamp(170px,44vmin,380px);
  transform:translateY(-50%);z-index:18;transition:right 1.4s ease-out;pointer-events:none;}
#arkadaslar svg{width:100%;overflow:visible;}
#arkadaslar .salgrup{animation:arkSal 3.2s ease-in-out infinite;}
@keyframes arkSal{0%,100%{transform:translateY(0)}50%{transform:translateY(-2vmin)}}

/* oyun objeleri */
.obje{position:absolute;left:0;top:0;z-index:15;will-change:transform;pointer-events:none;}
.obje svg{width:100%;height:100%;overflow:visible;}
.obje.balon svg{animation:balonNabiz 1.6s ease-in-out infinite;}
@keyframes balonNabiz{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.obje.altinB svg{animation:altinDon 2.4s linear infinite;}
@keyframes altinDon{to{transform:rotate(360deg)}}
.obje.kivilcim svg{animation:kivilcimDon 3.2s linear infinite;}
@keyframes kivilcimDon{to{transform:rotate(-360deg)}}

/* uçan +1 / parçacıklar */
.ucanYazi{position:absolute;z-index:35;font-weight:bold;color:var(--krem);
  font-size:clamp(18px,5vmin,36px);text-shadow:0 .4vmin 0 rgba(0,0,0,.25);
  pointer-events:none;animation:ucYukari 1s ease-out forwards;}
.ucanYazi.altinY{color:var(--altin);font-size:clamp(24px,7vmin,52px);}
@keyframes ucYukari{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-14vmin) scale(1.2);opacity:0}}
.parca{position:absolute;z-index:30;font-size:clamp(16px,4.6vmin,34px);pointer-events:none;
  animation:parcaUc 1.2s ease-out forwards;}
@keyframes parcaUc{0%{transform:translate(0,0) scale(.4);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(var(--dr));opacity:0}}

#nefesFlas{position:absolute;inset:0;z-index:45;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,246,232,.55),rgba(255,214,107,.25) 55%,transparent 80%);
  transition:opacity .3s;}
#nefesBuyuk{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);
  z-index:46;font-size:clamp(34px,10vmin,80px);font-weight:bold;color:var(--krem);
  text-shadow:0 .7vmin 0 rgba(0,0,0,.22);pointer-events:none;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
#nefesBuyuk.gor{transform:translate(-50%,-50%) scale(1);}
#carpFlas{position:absolute;inset:0;z-index:44;pointer-events:none;opacity:0;
  box-shadow:inset 0 0 18vmin rgba(224,58,47,.65);transition:opacity .12s;}
#sahne.sars{animation:sarsil .3s;}
@keyframes sarsil{0%,100%{transform:translate(0,0)}25%{transform:translate(-1vmin,.5vmin)}50%{transform:translate(1vmin,-.5vmin)}75%{transform:translate(-.6vmin,-.4vmin)}}

#ipucu{position:absolute;left:50%;top:62%;transform:translateX(-50%);z-index:42;
  display:flex;flex-direction:column;align-items:center;gap:1vmin;
  color:var(--krem);font-weight:bold;font-size:clamp(17px,4.6vmin,32px);
  text-shadow:0 .4vmin 0 rgba(0,0,0,.3);pointer-events:none;transition:opacity .4s;
  text-align:center;}
#ipucu .elIkon{font-size:clamp(44px,12vmin,90px);animation:elSurukle 1.8s ease-in-out infinite;}
@keyframes elSurukle{0%,100%{transform:translateY(-3vmin)}50%{transform:translateY(3vmin)}}

/* ---------- ORTAK KATMAN ---------- */
.ortKat{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2.6vmin;
  background:rgba(14,60,55,.5);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .35s;}
.ortKat.acik{opacity:1;pointer-events:auto;}
.kart{background:var(--krem);border-radius:4vmin;padding:4vmin 5.5vmin;
  display:flex;flex-direction:column;align-items:center;gap:2vmin;
  box-shadow:0 1.2vmin 0 rgba(0,0,0,.18),0 2.4vmin 4vmin rgba(0,0,0,.25);
  max-width:86vw;text-align:center;
  animation:kartGel .45s cubic-bezier(.34,1.56,.64,1);}
@keyframes kartGel{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- GİRİŞ EKRANI ---------- */
#girisEkrani{z-index:90;background:rgba(14,60,55,.25);}
#girisLogo{width:clamp(180px,42vmin,340px);
  filter:drop-shadow(0 1.6vmin 2.4vmin rgba(0,0,0,.3));
  animation:logoSal 4s ease-in-out infinite;}
@keyframes logoSal{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-1.8vmin) rotate(1.5deg)}}
#girisBaslik{color:var(--krem);font-weight:bold;font-size:clamp(20px,5.6vmin,40px);
  text-shadow:0 .5vmin 0 rgba(0,0,0,.25);margin-top:-1vmin;}
#oynaDugme{background:var(--mercan);color:var(--krem);
  font-size:clamp(24px,7vmin,48px);font-weight:bold;
  padding:2.4vmin 10vmin;border-radius:99px;box-shadow:0 1vmin 0 var(--mercan-koyu);
  transition:transform .12s;animation:oynaNabiz 1.8s ease-in-out infinite;}
@keyframes oynaNabiz{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#oynaDugme:active{transform:scale(.93);animation:none;}
.ikinciDugme{background:rgba(255,246,232,.25);color:var(--krem);
  font-size:clamp(14px,3.8vmin,24px);padding:1.6vmin 4.4vmin;border-radius:99px;font-weight:bold;}
#yayinevi{position:absolute;bottom:max(2.4vmin,env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);display:flex;align-items:center;gap:1.6vmin;opacity:.95;}
#yayinevi img{height:clamp(30px,7vmin,52px);}
#yayinevi span{color:var(--krem);font-weight:bold;font-size:clamp(13px,3.4vmin,22px);
  text-shadow:0 .3vmin 0 rgba(0,0,0,.25);}

/* ---------- BAŞARI KARTI ---------- */
.kart .buyukSkor{font-size:clamp(28px,8.4vmin,60px);font-weight:bold;}
.kart .altYazi{font-size:clamp(16px,4.4vmin,28px);font-weight:bold;}
.kart .rekor{font-size:clamp(14px,3.8vmin,24px);color:#7A6E5C;font-weight:bold;}
.kart .rekor.yeni{color:var(--mercan);animation:rekorZipla .6s cubic-bezier(.34,1.56,.64,1);}
@keyframes rekorZipla{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#tekrarDugme{background:var(--mercan);color:var(--krem);
  font-size:clamp(22px,6vmin,42px);font-weight:bold;
  padding:2.2vmin 8vmin;border-radius:99px;box-shadow:0 .9vmin 0 var(--mercan-koyu);
  transition:transform .12s;}
#tekrarDugme:active{transform:scale(.93);}
.kucukDugme{background:rgba(46,49,56,.1);color:var(--murekkep);font-weight:bold;
  font-size:clamp(13px,3.4vmin,20px);padding:1.5vmin 3.4vmin;border-radius:99px;}
#kitapMini{display:flex;align-items:center;gap:2vmin;background:rgba(46,49,56,.07);
  border-radius:2.6vmin;padding:1.6vmin 2.4vmin;cursor:pointer;border:none;font-family:inherit;}
#kitapMini img{width:clamp(48px,12vmin,84px);border-radius:1.2vmin;
  box-shadow:0 .5vmin 1.2vmin rgba(0,0,0,.25);transform:rotate(-3deg);}
#kitapMini .ky{font-weight:bold;font-size:clamp(13px,3.4vmin,20px);color:var(--murekkep);text-align:left;}
#kitapMini .ky small{display:block;color:#7A6E5C;font-weight:bold;font-size:.8em;}

/* ---------- NEFES ALANI ---------- */
#nefesEkrani{z-index:70;}
#nefesSahne{position:absolute;inset:0;}
#nefesPirpir{position:absolute;left:34%;top:52%;transform:translate(-50%,-50%);
  width:clamp(140px,36vmin,320px);animation:nefesSal 3.4s ease-in-out infinite;
  filter:drop-shadow(0 1.4vmin 1.6vmin rgba(0,0,0,.22));pointer-events:none;}
@keyframes nefesSal{0%,100%{transform:translate(-50%,-50%) rotate(-2deg)}50%{transform:translate(-50%,-56%) rotate(2deg)}}
#nefesKat{position:absolute;inset:0;pointer-events:none;overflow:visible;}
#nefesGeri{position:absolute;top:max(2vmin,env(safe-area-inset-top));left:2.6vmin;z-index:75;
  width:clamp(46px,9.5vmin,64px);height:clamp(46px,9.5vmin,64px);border-radius:50%;
  background:var(--krem);font-size:clamp(20px,4.6vmin,30px);
  box-shadow:0 .5vmin 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;}
#nefesBaslikYazi{position:absolute;top:max(3vmin,env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);color:var(--krem);font-weight:bold;
  font-size:clamp(18px,5vmin,36px);text-shadow:0 .4vmin 0 rgba(0,0,0,.3);
  pointer-events:none;white-space:nowrap;}
#nefesIpucu{position:absolute;left:50%;bottom:9vmin;transform:translateX(-50%);
  color:var(--krem);font-weight:bold;font-size:clamp(15px,4.2vmin,28px);
  text-shadow:0 .4vmin 0 rgba(0,0,0,.3);pointer-events:none;text-align:center;
  width:90vw;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01s !important;animation-iteration-count:1 !important;transition-duration:.01s !important;}
}
</style>
</head>

<script>
"use strict";
/* ================= YARDIMCILAR ================= */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const rast = (a,b) => a + Math.random()*(b-a);

/* ================= SES MOTORU ================= */
const Ses = {
  ctx:null, ana:null, acikMi:true,
  hazirla(){
    if(this.ctx){ if(this.ctx.state==="suspended") this.ctx.resume(); return; }
    const C = window.AudioContext||window.webkitAudioContext;
    if(!C) return;
    this.ctx = new C();
    this.ana = this.ctx.createGain();
    this.ana.gain.value = .5;
    this.ana.connect(this.ctx.destination);
  },
  nota(frek, sure=.25, tip="sine", kaz=.2, gec=0){
    if(!this.ctx || !this.acikMi) return;
    const t = this.ctx.currentTime + gec;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = tip; o.frequency.setValueAtTime(frek,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(kaz,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+sure);
    o.connect(g); g.connect(this.ana);
    o.start(t); o.stop(t+sure+.05);
  },
  gurultu(sure=.1, kaz=.16, frek=900){
    if(!this.ctx || !this.acikMi) return;
    const t = this.ctx.currentTime;
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate*sure, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*(1-i/d.length);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=frek;
    const g = this.ctx.createGain(); g.gain.value=kaz;
    src.connect(f); f.connect(g); g.connect(this.ana); src.start(t);
  },
  MERDIVEN:[523,587,659,784,880,1047,1175,1319],
  topla(kombo){
    const f = this.MERDIVEN[clamp(kombo-1,0,7)];
    this.nota(f,.18,"sine",.22);
    this.nota(f*2,.12,"sine",.08,.02);
  },
  carp(){ this.gurultu(.12,.22,500); this.nota(180,.25,"square",.1); this.nota(150,.3,"sine",.14,.08); },
  altin(){ [659,784,1047].forEach((f,i)=>this.nota(f,.3,"triangle",.18,i*.07)); },
  donusum(i){ this.nota(784+i*80,.16,"sine",.16,i*.07); },
  zafer(){ [523,659,784,880,1047,1319].forEach((f,i)=>this.nota(f,.32,"sine",.2,i*.1)); },
  blup(){ this.nota(280,.14,"sine",.18); this.nota(560,.12,"sine",.12,.05); },
  nefesBasari(){ this.nota(659,.3,"sine",.2); this.nota(784,.34,"sine",.18,.1); this.gurultu(.25,.07,1400); },
  pat(){ this.gurultu(.09,.2,800); this.nota(220,.18,"sine",.14); },
  kapiSes(){ this.nota(392,.3,"sine",.16); this.nota(330,.36,"sine",.14,.15); },
};

/* ================= GENEL DURUM ================= */
const O = {
  girisYapildi:false,
  calisiyor:false,
  duraklat:false,          // nefes kapısı açıkken
  bitis:false,             // arkadaşlara kavuşma sahnesi
  ilerleme:0,              // 0..1 yolculuk
  skor:0, rekor:0, kombo:0,
  ofke:0,                  // 0..100 — kendiliğinden dolar
  can:3,
  dokunulmaz:0,
  zamanOlcek:1,
  sonSpawn:0, sonAltin:-6, zaman:0,
  hedefY:null, py:0, pyHazir:false,
  isaretci:false,
  sonT:0,
  ekran:"oyun",            // oyun | nefes
};
const objeler = [];

/* ================= SPRITE ================= */
const spriteler = [...document.querySelectorAll(".pSprite")];
let aktifSprite = 0;
function spriteSec(i){
  i = clamp(i,0,5);
  if(i===aktifSprite) return;
  spriteler[aktifSprite].classList.remove("gor");
  spriteler[i].classList.add("gor");
  aktifSprite = i;
}
function ofkeyiCiz(){
  const o = O.ofke;
  $("#ofkeDolgu").style.clipPath = `inset(0 ${100-o}% 0 0 round 99px)`;
  let i;
  if(o<17) i=0; else if(o<33) i=1; else if(o<50) i=2;
  else if(o<67) i=3; else if(o<84) i=4; else i=5;
  spriteSec(i);
  $("#aura").style.opacity = (o/100)*.9;
}
function canCiz(){
  [...document.querySelectorAll("#canlar .kalp")].forEach((k,i)=>{
    k.classList.toggle("gitti", i >= O.can);
  });
}
function yoluCiz(){
  const y = O.ilerleme*100;
  $("#yolDolgu").style.clipPath = `inset(0 ${100-y}% 0 0 round 99px)`;
  $("#yolPirpir").style.left = `calc(${y}% )`;
}

/* ortam baloncukları */
(function(){
  const kap = $("#ortamBaloncuklar");
  for(let i=0;i<12;i++){
    const b = document.createElement("div");
    b.className = "ob";
    const s = 6+Math.random()*14;
    b.style.width = b.style.height = s+"px";
    b.style.left = Math.random()*100+"%";
    b.style.animationDuration = (9+Math.random()*10)+"s";
    b.style.animationDelay = (-Math.random()*14)+"s";
    kap.appendChild(b);
  }
})();

/* ================= OBJELER ================= */
const objeKat = $("#objeKat");
const SVG_BALON = `<svg viewBox="-50 -50 100 100">
  <circle r="40" fill="rgba(255,255,255,.3)" stroke="rgba(255,255,255,.95)" stroke-width="4"/>
  <ellipse cx="-14" cy="-16" rx="10" ry="6" fill="rgba(255,255,255,.85)"/></svg>`;
const SVG_ALTIN = `<svg viewBox="-50 -50 100 100">
  <circle r="40" fill="rgba(255,214,107,.45)" stroke="#FFD66B" stroke-width="5"/>
  <ellipse cx="-14" cy="-16" rx="10" ry="6" fill="rgba(255,255,255,.9)"/>
  <path d="M0,-18 L5,-5 L18,-5 L8,3 L12,16 L0,8 L-12,16 L-8,3 L-18,-5 L-5,-5 Z" fill="#FFF6E8"/></svg>`;
const SVG_KIVILCIM = `<svg viewBox="-50 -50 100 100">
  <path d="M0,-42 L9,-14 L38,-20 L16,0 L38,20 L9,14 L0,42 L-9,14 L-38,20 L-16,0 L-38,-20 L-9,-14 Z"
    fill="#FF5436" stroke="#C9301C" stroke-width="4" stroke-linejoin="round"/>
  <circle r="13" fill="#FF8A5C"/>
  <circle cx="-4" cy="-3" r="2.6" fill="#5A1408"/><circle cx="5" cy="-3" r="2.6" fill="#5A1408"/>
  <path d="M-5,5 Q0,2 5,5" stroke="#5A1408" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`;

function objeYap(tip){
  const s = $("#sahne").getBoundingClientRect();
  const el = document.createElement("div");
  const vm = Math.min(s.width, s.height)/100;
  let boy, svg, cls;
  if(tip==="balon"){ boy = rast(9,12)*vm; svg = SVG_BALON; cls="balon"; }
  else if(tip==="altin"){ boy = 13*vm; svg = SVG_ALTIN; cls="altinB"; }
  else { boy = rast(10,13)*vm; svg = SVG_KIVILCIM; cls="kivilcim"; }
  el.className = "obje "+cls;
  el.style.width = el.style.height = boy+"px";
  el.innerHTML = svg;
  objeKat.appendChild(el);
  objeler.push({
    el, tip,
    x: s.width + boy,
    y: rast(s.height*.16, s.height*.82),
    r: boy*.42,
    hizX: (s.width*.0026)*rast(.9,1.1),
    salinim: Math.random()*Math.PI*2,
    salGen: rast(.2,.9)*vm*8,
  });
}
function objeSil(o){
  o.el.remove();
  const i = objeler.indexOf(o);
  if(i>=0) objeler.splice(i,1);
}
function hepsiniTemizle(parlat=false){
  objeler.slice().forEach(o=>{
    if(parlat) parcala(o.x, o.y, ["🫧"], 2);
    objeSil(o);
  });
}

/* ================= EFEKTLER ================= */
function ucanYazi(x,y,metin,altin=false){
  const d = document.createElement("div");
  d.className = "ucanYazi"+(altin?" altinY":"");
  d.textContent = metin;
  d.style.left = x+"px"; d.style.top = y+"px";
  $("#sahne").appendChild(d);
  setTimeout(()=>d.remove(),1000);
}
function parcala(x,y,semboller,adet=6,kap=null){
  for(let i=0;i<adet;i++){
    const p = document.createElement("div");
    p.className = "parca";
    p.textContent = semboller[i%semboller.length];
    p.style.left = x+"px"; p.style.top = y+"px";
    const a = Math.random()*Math.PI*2, m = 8+Math.random()*16;
    p.style.setProperty("--dx", Math.cos(a)*m+"vmin");
    p.style.setProperty("--dy", (Math.sin(a)*m-6)+"vmin");
    p.style.setProperty("--dr", (Math.random()*180-90)+"deg");
    (kap||$("#sahne")).appendChild(p);
    setTimeout(()=>p.remove(),1200);
  }
}
function komboGoster(){
  const k = $("#komboYazi");
  if(O.kombo>=3){ k.textContent = "x"+O.kombo+" ✨"; k.classList.add("gor"); }
  else k.classList.remove("gor");
}

/* ================= ÇEKİRDEK OLAYLAR ================= */
function balonTopla(o){
  O.kombo++;
  O.skor += 1;
  O.ofke = clamp(O.ofke - AYAR.BALONCUK_SAKINLIK, 0, 100);
  ofkeyiCiz();
  $("#skorYazi").textContent = O.skor;
  Ses.topla(O.kombo);
  komboGoster();
  ucanYazi(o.x, o.y-o.r, "+1");
  parcala(o.x,o.y,["🫧","✨"],4);
  const p = $("#pirpir");
  p.classList.remove("mutlu"); void p.offsetWidth; p.classList.add("mutlu");
  objeSil(o);
}
function kivilcimCarp(o){
  if(O.dokunulmaz>0) return;
  O.kombo = 0; komboGoster();
  O.can--;
  canCiz();
  O.dokunulmaz = 1.3;
  Ses.carp();
  parcala(o.x,o.y,["💔","💢"],5);
  objeSil(o);
  const sahne = $("#sahne"), p = $("#pirpir");
  sahne.classList.remove("sars"); void sahne.offsetWidth; sahne.classList.add("sars");
  p.classList.remove("carp"); void p.offsetWidth; p.classList.add("carp");
  p.classList.add("yanip"); setTimeout(()=>p.classList.remove("yanip"),1100);
  $("#carpFlas").style.opacity = 1;
  setTimeout(()=>$("#carpFlas").style.opacity = 0, 180);
  if(O.can<=0) kayip();
}
function altinTopla(o){
  Ses.altin();
  objeSil(o);
  O.zamanOlcek = .25;
  $("#nefesFlas").style.opacity = 1;
  $("#nefesBuyuk").classList.add("gor");
  O.ofke = 0; ofkeyiCiz();
  ucanYazi(o.x,o.y-o.r,"NEFES!",true);
  const kivilcimlar = objeler.filter(b=>b.tip==="kivilcim");
  kivilcimlar.forEach((b,i)=>{
    setTimeout(()=>{
      if(!objeler.includes(b)) return;
      b.tip = "balon";
      b.el.className = "obje balon";
      b.el.innerHTML = SVG_BALON;
      Ses.donusum(i);
      parcala(b.x,b.y,["✨"],3);
    }, 200+i*140);
  });
  setTimeout(()=>{
    O.zamanOlcek = 1;
    $("#nefesFlas").style.opacity = 0;
    $("#nefesBuyuk").classList.remove("gor");
  }, 1500);
}

/* ================= TUR AKIŞI ================= */
function turBaslat(){
  hepsiniTemizle();
  O.calisiyor = true; O.duraklat = false; O.bitis = false;
  O.ilerleme = 0; O.zaman = 0;
  O.skor = 0; O.kombo = 0; O.ofke = 0; O.can = AYAR.CAN;
  O.dokunulmaz = 0; O.zamanOlcek = 1;
  O.sonSpawn = 0; O.sonAltin = -6;
  $("#skorYazi").textContent = 0;
  ofkeyiCiz(); canCiz(); komboGoster(); yoluCiz();
  $("#pirpir").style.left = "10%";
  $("#arkadaslar").style.right = "-46%";
  $("#sonKat").classList.remove("acik");
  $("#ipucu").style.opacity = 0;
}
function kayip(){
  O.calisiyor = false; O.bitis = true;
  hepsiniTemizle();
  Ses.kapiSes();
  setTimeout(()=>{
    $("#sonBaslik").textContent = "Canlar bitti! Bir daha dene 💪";
    const yeniRekor = O.skor > O.rekor;
    if(yeniRekor) O.rekor = O.skor;
    $("#sonSkor").textContent = O.skor;
    const r = $("#sonRekor");
    r.textContent = yeniRekor ? "🎉 YENİ REKOR!" : "⭐ Rekor: "+O.rekor;
    r.classList.toggle("yeni", yeniRekor);
    $("#sonKat").classList.add("acik");
  }, 700);
}
function kavusma(){
  O.calisiyor = false; O.bitis = true;
  $("#sonBaslik").textContent = "🎉 Arkadaşlarına ulaştın! 💛";
  hepsiniTemizle(true);
  Ses.zafer();
  // arkadaşlar gelir, Pırpır onlara yüzer
  $("#arkadaslar").style.right = "4%";
  setTimeout(()=>{ $("#pirpir").style.left = "38%"; }, 500);
  setTimeout(()=>{
    const s = $("#sahne").getBoundingClientRect();
    parcala(s.width*.62, s.height*.45, ["💛","🧡","✨","🫧"], 14);
    Ses.zafer();
  }, 1900);
  setTimeout(()=>{
    const yeniRekor = O.skor > O.rekor;
    if(yeniRekor) O.rekor = O.skor;
    $("#sonSkor").textContent = O.skor;
    const r = $("#sonRekor");
    r.textContent = yeniRekor ? "🎉 YENİ REKOR!" : "⭐ Rekor: "+O.rekor;
    r.classList.toggle("yeni", yeniRekor);
    $("#sonKat").classList.add("acik");
  }, 3100);
}

/* ================= ANA DÖNGÜ ================= */
function dongu(t){
  requestAnimationFrame(dongu);
  let dt = Math.min((t - O.sonT)/1000, .05);
  O.sonT = t;
  if(O.ekran!=="oyun" || O.duraklat) return;
  const s = $("#sahne").getBoundingClientRect();
  const p = $("#pirpir");
  const pBoy = p.getBoundingClientRect().width;

  /* Pırpır hareketi (py = merkez) */
  if(!O.pyHazir){ O.py = s.height*.5; O.pyHazir = true; }
  const hedef = (O.hedefY===null || O.bitis)
    ? s.height*.5 + Math.sin(t/900)*s.height*.025
    : clamp(O.hedefY, s.height*.10, s.height*.88);
  O.py += (hedef - O.py) * Math.min(1, dt*9);
  const egim = clamp((hedef-O.py)*.25, -16, 16);
  p.style.transform = `translateY(${O.py - pBoy/2 - s.height*.45}px) rotate(${egim}deg)`;

  if(!O.calisiyor) return;
  dt *= O.zamanOlcek;
  O.zaman += dt;
  if(O.dokunulmaz>0) O.dokunulmaz -= dt;

  /* öfke kendiliğinden yükselir; dolarsa nefes kapısı */
  O.ofke = clamp(O.ofke + AYAR.OFKE_HIZI*dt, 0, 100);
  ofkeyiCiz();
  if(O.ofke>=100){ nefesKapisiAc(); return; }

  /* yolculuk ilerler */
  O.ilerleme = clamp(O.ilerleme + dt/AYAR.YOLCULUK_SURESI, 0, 1);
  yoluCiz();
  if(O.ilerleme>=1){ kavusma(); return; }

  /* zorluk: yol ilerledikçe artar */
  const hiz = 1 + O.ilerleme*1.5;
  const spawnAraligi = Math.max(AYAR.SPAWN_SON, AYAR.SPAWN_BAS - O.ilerleme*(AYAR.SPAWN_BAS-AYAR.SPAWN_SON));

  O.sonSpawn += dt;
  if(O.sonSpawn >= spawnAraligi){
    O.sonSpawn = 0;
    const altinZamani = (O.zaman - O.sonAltin) > 14;
    if(altinZamani && Math.random()<.35){ objeYap("altin"); O.sonAltin = O.zaman; }
    else objeYap(Math.random()<.52 ? "balon" : "kivilcim");
  }

  const px = s.width*.10 + pBoy/2;
  const pyM = O.py;
  const pr = pBoy*.34;
  for(const o of objeler.slice()){
    o.x -= o.hizX * hiz * (dt*60);
    o.salinim += dt*2.2;
    const oy = o.y + Math.sin(o.salinim)*o.salGen;
    o.el.style.transform = `translate(${o.x-o.el.offsetWidth/2}px, ${oy-o.el.offsetHeight/2}px)`;
    if(o.x < -o.r*3){ objeSil(o); continue; }
    const dx = o.x-px, dy = oy-pyM;
    if(dx*dx+dy*dy < (o.r+pr)*(o.r+pr)){
      if(o.tip==="balon") balonTopla(o);
      else if(o.tip==="altin") altinTopla(o);
      else kivilcimCarp(o);
    }
  }
}

/* ================= GİRİŞ (sürükle) ================= */
const sahne = $("#sahne");
sahne.addEventListener("pointerdown", e=>{
  if(e.target.closest("button") || !O.girisYapildi) return;
  Ses.hazirla();
  O.isaretci = true;
  O.hedefY = e.clientY - sahne.getBoundingClientRect().top;
  if(!O.calisiyor && !O.bitis && !$("#sonKat").classList.contains("acik")) turBaslat();
});
sahne.addEventListener("pointermove", e=>{
  const fareSerbest = e.pointerType==="mouse" && O.calisiyor;
  if(!O.isaretci && !fareSerbest) return;
  O.hedefY = e.clientY - sahne.getBoundingClientRect().top;
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>
  sahne.addEventListener(ev, ()=>{ O.isaretci = false; })
);

/* ================= DÜĞMELER ================= */
$("#oynaDugme").onclick = ()=>{
  Ses.hazirla();
  O.girisYapildi = true;
  $("#girisEkrani").classList.remove("acik");
  $("#ipucu").style.opacity = 1;
};
$("#tekrarDugme").onclick = ()=>{ Ses.hazirla(); turBaslat(); };
$("#sesDugme").onclick = function(){
  Ses.hazirla();
  Ses.acikMi = !Ses.acikMi;
  this.textContent = Ses.acikMi ? "🔊":"🔇";
};
$("#kitapMini").onclick = function(){
  if(AYAR.KITAP_LINKI) window.open(AYAR.KITAP_LINKI,"_blank","noopener");
  else{
    $("#kitapMiniAlt").textContent = "Yakında satışta! 📚";
    setTimeout(()=>$("#kitapMiniAlt").textContent = "Keşfetmek için dokun", 2200);
  }
};

/* ================= NEFES ALANI =================
   İki kip:
   - "kapi": oyun içinde kızarınca → 1 başarılı nefes → oyuna devam
   - "kose": serbest egzersiz (giriş ve başarı kartından)
*/
const NB = { var:false, r:0, tatli:false, kip:"kose" };
const PENCERE_ALT=.75, PENCERE_UST=1.25, PATLAMA=1.5, BUYUME=3.4;
let nbHalka,nbBalon,nbParlak;
function nefesKur(){
  const kat = $("#nefesKat"), NS="http://www.w3.org/2000/svg";
  kat.innerHTML = "";
  const r = $("#nefesSahne").getBoundingClientRect();
  kat.setAttribute("viewBox",`0 0 ${r.width} ${r.height}`);
  kat.style.width = r.width+"px"; kat.style.height = r.height+"px";
  nbHalka = document.createElementNS(NS,"circle");
  nbHalka.setAttribute("fill","none");
  nbHalka.setAttribute("stroke-dasharray","10 12");
  nbHalka.setAttribute("stroke-linecap","round");
  nbBalon = document.createElementNS(NS,"circle");
  nbBalon.setAttribute("fill","rgba(255,255,255,.3)");
  nbBalon.setAttribute("stroke","rgba(255,255,255,.95)");
  nbBalon.setAttribute("stroke-width","3.5");
  nbParlak = document.createElementNS(NS,"ellipse");
  nbParlak.setAttribute("fill","rgba(255,255,255,.85)");
  kat.appendChild(nbHalka);kat.appendChild(nbBalon);kat.appendChild(nbParlak);
  nefesGizle();
}
function nAgiz(){
  const k = $("#nefesPirpir").getBoundingClientRect();
  const s = $("#nefesSahne").getBoundingClientRect();
  return { x:k.left-s.left+k.width*.63, y:k.top-s.top+k.height*.63 };
}
function nHedefR(){
  const r = $("#nefesSahne").getBoundingClientRect();
  return Math.min(r.width,r.height)*.14;
}
function nefesGizle(){ [nbHalka,nbBalon,nbParlak].forEach(e=>e&&e.setAttribute("opacity","0")); }
function nefesCiz(){
  const a = nAgiz(), R = nHedefR(), r = NB.r;
  const cx = a.x+R*1.15, cy = a.y;
  nbHalka.setAttribute("cx",cx);nbHalka.setAttribute("cy",cy);nbHalka.setAttribute("r",R);
  nbHalka.setAttribute("opacity",NB.var?"1":"0");
  nbHalka.setAttribute("stroke",NB.tatli?"#FFD66B":"rgba(255,255,255,.85)");
  nbHalka.setAttribute("stroke-width",NB.tatli?"8":"5");
  nbBalon.setAttribute("cx",cx);nbBalon.setAttribute("cy",cy);
  nbBalon.setAttribute("r",Math.max(r,.1));
  nbBalon.setAttribute("opacity",NB.var?"1":"0");
  nbParlak.setAttribute("cx",cx-r*.35);nbParlak.setAttribute("cy",cy-r*.4);
  nbParlak.setAttribute("rx",r*.18);nbParlak.setAttribute("ry",r*.11);
  nbParlak.setAttribute("opacity",NB.var&&r>14?".85":"0");
}
function nefesUcur(r){
  const NS="http://www.w3.org/2000/svg", kat=$("#nefesKat");
  const a = nAgiz(), R = nHedefR();
  const g = document.createElementNS(NS,"g");
  g.innerHTML = `<circle r="${r}" fill="rgba(255,255,255,.32)" stroke="rgba(255,255,255,.95)" stroke-width="3.5"/>
    <ellipse cx="${-r*.35}" cy="${-r*.4}" rx="${r*.18}" ry="${r*.11}" fill="rgba(255,255,255,.85)"/>`;
  kat.appendChild(g);
  const x0=a.x+R*1.15, y0=a.y, t0=performance.now(), sure=2000;
  (function adim(t){
    const k=(t-t0)/sure;
    if(k>=1){ g.remove(); return; }
    g.setAttribute("transform",`translate(${x0+Math.sin(k*7)*r*.5},${y0-k*(y0+r*2)}) scale(${1-k*.25})`);
    g.setAttribute("opacity",1-k*k);
    requestAnimationFrame(adim);
  })(t0);
}
function nefesDongu(t){
  if(O.ekran!=="nefes") return;
  requestAnimationFrame(nefesDongu);
  const dt = Math.min((t-(nefesDongu._t||t))/1000,.05);
  nefesDongu._t = t;
  if(NB.var){
    const R = nHedefR();
    NB.r += (R*PATLAMA/BUYUME)*dt;
    const tatli = NB.r>=R*PENCERE_ALT && NB.r<=R*PENCERE_UST;
    if(tatli && !NB.tatli) Ses.nota(880,.12,"triangle",.16);
    NB.tatli = tatli;
    if(NB.r > R*PATLAMA){ NB.var=false; NB.r=0; Ses.pat(); nefesGizle(); }
    else nefesCiz();
  }
}
function nefesAc(kip){
  NB.kip = kip;
  NB.var = false; NB.r = 0;
  O.ekran = "nefes";
  // kapi: kızgın Pırpır görseli + zorunlu; kose: sakin görsel + geri düğmesi
  $("#nefesPirpir").src = kip==="kapi" ? spriteler[5].src : spriteler[0].src;
  $("#nefesGeri").style.display = kip==="kapi" ? "none" : "flex";
  $("#nefesBaslikYazi").textContent = kip==="kapi" ? "Pırpır çok kızdı! 😤" : "Nefes Köşesi 🫧";
  $("#nefesIpucu").textContent = "Baloncuğu halkaya kadar büyüt ve tekrar dene 🫧";
  $("#nefesEkrani").classList.add("acik");
  nefesKur();
  nefesDongu._t = performance.now();
  requestAnimationFrame(nefesDongu);
}
function nefesKapat(){
  NB.var = false; nefesGizle();
  O.ekran = "oyun";
  $("#nefesEkrani").classList.remove("acik");
}
function nefesKapisiAc(){
  O.duraklat = true;
  O.zamanOlcek = 1;
  $("#nefesFlas").style.opacity = 0;
  $("#nefesBuyuk").classList.remove("gor");
  Ses.kapiSes();
  setTimeout(()=>nefesAc("kapi"), 450);
}
const nefesSahneEl = $("#nefesSahne");
nefesSahneEl.addEventListener("pointerdown", e=>{
  if(e.target.closest("button")) return;
  NB.var = true; NB.r = 6; NB.tatli = false; Ses.blup();
});
function nefesBirak(){
  if(!NB.var) return;
  NB.var = false;
  const R = nHedefR(), r = NB.r;
  const basarili = r>=R*PENCERE_ALT && r<=R*PENCERE_UST;
  if(basarili){
    Ses.nefesBasari(); nefesUcur(r);
    const s = nefesSahneEl.getBoundingClientRect();
    parcala(s.width*.5, s.height*.3, ["⭐","✨","🫧"], 5, nefesSahneEl);
    if(NB.kip==="kapi"){
      // Pırpır sakinleşti → oyuna kaldığı yerden devam
      $("#nefesPirpir").src = spriteler[0].src;
      setTimeout(()=>{
        nefesKapat();
        hepsiniTemizle();          // temiz bir başlangıç anı
        O.ofke = 0; ofkeyiCiz();
        O.kombo = 0; komboGoster();
        O.dokunulmaz = 1.5;
        O.duraklat = false;
      }, 1100);
    }
  } else if(r<R*PENCERE_ALT) Ses.blup();
  NB.r = 0; nefesGizle();
}
["pointerup","pointercancel","pointerleave"].forEach(ev=>nefesSahneEl.addEventListener(ev,nefesBirak));

$("#girisNefesDugme").onclick = ()=>{ Ses.hazirla(); NB.donusEkrani="giris"; $("#girisEkrani").classList.remove("acik"); nefesAc("kose"); };
$("#nefesKoseDugme").onclick = ()=>{ Ses.hazirla(); NB.donusEkrani="son"; $("#sonKat").classList.remove("acik"); nefesAc("kose"); };
$("#nefesGeri").onclick = ()=>{
  nefesKapat();
  if(NB.donusEkrani==="giris" && !O.girisYapildi) $("#girisEkrani").classList.add("acik");
  else if(NB.donusEkrani==="son") $("#sonKat").classList.add("acik");
};

/* ================= BAŞLAT ================= */
window.addEventListener("resize", ()=>{ if(O.ekran==="nefes") nefesKur(); });
document.addEventListener("contextmenu", e=>e.preventDefault());
O.sonT = performance.now();
requestAnimationFrame(dongu);
</script>
